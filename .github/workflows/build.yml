name: MotionFlow - Build APK

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: motionflow-source-build
  cancel-in-progress: true

jobs:
  build:
    name: Compilar código da branch source-archive
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Checkout do workflow
        uses: actions/checkout@v4

      - name: Checkout do código-fonte
        uses: actions/checkout@v4
        with:
          ref: source-archive
          path: source

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Configurar Android SDK
        uses: android-actions/setup-android@v4

      - name: Instalar SDK 35
        run: sdkmanager --install "platforms;android-35" "build-tools;35.0.0"

      - name: Configurar Gradle 8.9
        uses: gradle/gradle-build-action@v3
        with:
          gradle-version: "8.9"

      - name: Validar estrutura do projeto
        working-directory: source
        run: |
          test -f settings.gradle.kts
          test -f app/build.gradle.kts
          test -f app/src/main/java/app/motionflow/ui/MotionFlowApp.kt

      - name: Compilar APK debug
        working-directory: source
        run: gradle --no-daemon --stacktrace assembleDebug

      - name: Publicar APK como artefato
        uses: actions/upload-artifact@v4
        with:
          name: MotionFlow-debug-${{ github.run_number }}
          path: source/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14

      - name: Resumo do build
        if: success()
        shell: bash
        run: |
          echo "## MotionFlow APK gerado" >> "$GITHUB_STEP_SUMMARY"
          echo "O APK debug foi compilado diretamente da branch source-archive." >> "$GITHUB_STEP_SUMMARY"
          echo "Abra a seção Artifacts desta execução para baixar." >> "$GITHUB_STEP_SUMMARY"
